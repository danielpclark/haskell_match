[package]
name = "haskell_match"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Haskell-style pattern matching for Ruby, compiled to decision trees in Rust"
publish = false

[lib]
name = "haskell_match"
crate-type = ["cdylib"]

[dependencies]
# Rutie 0.13 targets Ruby 3.x; Rutie 0.14 targets Ruby 4.0.
rutie = "0.13"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
